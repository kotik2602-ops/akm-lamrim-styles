<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="46%" cy="42%" r="62%">
      <stop offset="0" stop-color="#fff4e2"/>
      <stop offset=".35" stop-color="#fbd9c4"/>
      <stop offset=".7" stop-color="#f3b9c4"/>
      <stop offset="1" stop-color="#e3a2d6"/>
    </radialGradient>
    <radialGradient id="bloom" cx="30%" cy="80%" r="50%">
      <stop offset="0" stop-color="#e98fd0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e98fd0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset=".45" stop-color="#ff9a4d"/>
      <stop offset="1" stop-color="#ffcf7a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset=".2" stop-color="#ffe9a8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffcf6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d07a"/><stop offset="1" stop-color="#c9952e"/>
    </linearGradient>
    <path id="arcB" d="M 46 200 A 154 154 0 0 0 354 200"/>
  </defs>
  <!-- glowing ring -->
  <circle cx="200" cy="200" r="186" fill="none" stroke="url(#ringG)" stroke-width="16" filter="url(#soft)" opacity=".95"/>
  <circle cx="200" cy="200" r="184" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="184" fill="url(#bloom)"/>
  <circle cx="200" cy="200" r="184" fill="none" stroke="#fff3d6" stroke-width="3"/>
  <!-- AKM mark: dark disc with golden dome and mountains -->
  <g transform="translate(200 66)">
    <circle r="22" fill="#5a1f2a"/>
    <path d="M-16 4 C-16 -12 16 -12 16 4 Z" fill="url(#dome)"/>
    <path d="M-15 12 L-5 1 L1 7 L8 -1 L15 12" fill="none" stroke="#f6e7c8" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <g transform="translate(24 6) scale(.88)">
  <!-- golden sparkle at the heart -->
  <circle cx="200" cy="168" r="44" fill="url(#spark)"/>
  <g stroke="#fff6d6" stroke-linecap="round" opacity=".9">
    <path d="M200 140v56M172 168h56" stroke-width="1.6"/>
    <path d="M184 152l32 32M216 152l-32 32" stroke-width="1"/>
  </g>
  <!-- figure: hand-drawn feel, thinner maroon line -->
  <g fill="none" stroke="#6b2330" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="6" d="M200 246 C162 218 126 190 127 150 C128 118 160 104 184 118 C193 124 198 133 200 141 C203 132 209 123 218 117 C243 103 273 117 274 150 C275 189 239 217 200 246 C232 266 300 284 307 266 C314 247 262 238 200 246 C140 254 86 246 92 265 C98 284 168 268 200 246"/>
    <path stroke-width="5" d="M201 190 C188 181 179 172 180 161 C181 150 193 147 201 158 C206 149 214 145 220 149 C226 154 222 161 216 160"/>
    <path stroke-width="5" d="M220 149 C226 160 223 173 201 190"/>
  </g>
  <circle cx="200" cy="168" r="3.6" fill="#fffdf2"/>
  </g>
  <!-- title -->
  <text font-family="Manrope, 'Arial Rounded MT Bold', Arial, sans-serif" font-weight="800" font-size="23" letter-spacing="1.5" fill="#6b2330">
    <textPath href="#arcB" startOffset="50%" text-anchor="middle">КЛУБ МЕДИТАЦИИ АКМ</textPath>
  </text>
</svg>
