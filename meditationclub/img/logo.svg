<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".62" stop-color="#f8ead6"/>
      <stop offset="1" stop-color="#efd3c4"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d991"/>
      <stop offset=".5" stop-color="#ddae35"/>
      <stop offset="1" stop-color="#a8780f"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3340"/>
      <stop offset="1" stop-color="#5a1c25"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".25" stop-color="#f3d991" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ddae35" stop-opacity="0"/>
    </radialGradient>
    <path id="arcB" d="M 54 196 A 146 146 0 0 0 346 196"/>
  </defs>
  <circle cx="200" cy="200" r="194" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="194" fill="none" stroke="url(#rim)" stroke-width="5"/>
  <circle cx="200" cy="200" r="182" fill="none" stroke="#ddae35" stroke-opacity=".45" stroke-width="1"/>
  <!-- AKM mark -->
  <g transform="translate(200 62)">
    <circle r="20" fill="url(#rim)"/>
    <path d="M-16 8 L-6 -3 L0 3 L7 -6 L16 8 Z" fill="#fffaf0"/>
    <path d="M-16 8 L-6 -3 L0 3 L7 -6 L16 8" fill="none" stroke="#69232d" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <!-- glow at the heart -->
