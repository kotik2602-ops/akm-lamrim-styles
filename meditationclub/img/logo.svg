  <!-- figure: heart body + crossed-legs loop, one continuous line -->
  <g fill="none" stroke="url(#ink)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200 250 C160 220 122 190 124 150 C126 116 160 104 184 120 C192 126 198 134 200 142 C202 134 208 126 216 120 C240 104 274 116 276 150 C278 190 240 220 200 250 C236 272 300 286 306 266 C312 246 262 240 200 250 C138 260 88 246 94 266 C100 286 164 272 200 250"/>
    <path d="M200 196 C186 186 176 176 177 164 C178 152 192 150 200 162 C208 150 222 152 223 164 C224 176 214 186 200 196" stroke-width="7"/>
  </g>
  <circle cx="200" cy="174" r="4.5" fill="#fff8e0"/></g>
  <!-- title on the lower arc -->
  <text font-family="Unbounded, Manrope, Arial, sans-serif" font-weight="700" font-size="21" letter-spacing="2.5" fill="#69232d">
    <textPath href="#arcB" startOffset="50%" text-anchor="middle" dy="0">КЛУБ МЕДИТАЦИИ АКМ</textPath>
