<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Фонд Вечной Мудрости — фавикон</title>
  <!-- Арка (бордо): верх до горизонта, с вырезом под восходящее семя-солнце -->
  <path fill-rule="evenodd" d="M50 285V174A150 150 0 0 1 350 174V285Z M114 285A86 86 0 0 1 286 285Z" fill="#6b2430"/>
  <!-- Основание арки под линией горизонта (горизонт = прозрачный зазор 22) -->
  <path d="M50 307H350V368Q350 376 342 376H58Q50 376 50 368Z" fill="#6b2430"/>
  <!-- Семя-солнце: полукруг, восходящий из горизонта -->
  <path d="M114 285A86 86 0 0 1 286 285Z" fill="#ddae35"/>
</svg>
