<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Фонд Вечной Мудрости — знак «Семя и солнце»</title>
  <!-- Арка (бордо): верх до горизонта, с вырезом под восходящее семя-солнце -->
  <path fill-rule="evenodd" d="M92 264.5V182A108 108 0 0 1 308 182V264.5Z M138 264.5A62 62 0 0 1 262 264.5Z" fill="#6b2430"/>
  <!-- Основание арки под линией горизонта (горизонт = прозрачный зазор 7) -->
  <path d="M92 271.5H308V320Q308 326 302 326H98Q92 326 92 320Z" fill="#6b2430"/>
  <!-- Семя-солнце: полукруг, восходящий из горизонта -->
  <path d="M138 264.5A62 62 0 0 1 262 264.5Z" fill="#ddae35"/>
</svg>
