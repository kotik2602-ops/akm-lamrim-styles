<style>
:root{--gold:#ddae35;--bur:#6b2430;--blue:#1f4058;--night:#0f1d2b;--cream:#f4f0e8}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--bur);font-family:Manrope,sans-serif}
.row{display:flex;flex-wrap:wrap}.panel{flex:1 1 300px;height:460px;display:flex;align-items:center;justify-content:center}
.panel svg{width:420px;height:420px;max-width:92%}.night{background:var(--night)}
.lock{display:flex;align-items:center;gap:26px;padding:56px 48px;flex-wrap:wrap}
.mk svg{height:102px;width:auto;display:block}
.wm .f{font-weight:600;font-size:11px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:8px}
.wm .v{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:44px;line-height:1;white-space:nowrap}
.wm .s{font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-top:10px}
.lock.dark{background:var(--night);color:var(--cream)}.lock.dark .f{color:var(--gold)}
.szrow{display:flex;gap:30px;align-items:flex-end;padding:28px 48px}.sz{text-align:center;font-size:11px;color:#8a6a60}
.szrow.dk{background:var(--night)}.dk .sz{color:#9aa7b3}
